<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SniffCheck</title>
<style>
  :root {
    --bg: #07090a;
    --panel: #111517;
    --line: #1f2629;
    --text: #e8f3ef;
    --muted: #7d8d88;
    --mint: #3dffb4;
    --yellow: #ffe14d;
    --orange: #ff9a3c;
    --red: #ff4d5e;
    --glow: var(--mint);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #0f1a17 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .app { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 20px; }
  header { display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 24px; letter-spacing: -0.5px; }
  .logo-mark {
    width: 40px; height: 40px; border-radius: 12px; background: #000;
    border: 2px solid var(--mint); box-shadow: 0 0 14px var(--mint);
    display: grid; place-items: center; font-size: 20px;
  }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--mint); box-shadow: 0 0 8px var(--mint); }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 24px;
    padding: 28px 20px; text-align: center;
  }
  .gauge-wrap { position: relative; width: 260px; height: 150px; margin: 0 auto; }
  svg { width: 100%; height: 100%; overflow: visible; }
  .score {
    position: absolute; left: 0; right: 0; bottom: 0;
    font-size: 64px; font-weight: 800; line-height: 1;
    color: var(--glow); text-shadow: 0 0 20px var(--glow);
    transition: color .4s, text-shadow .4s;
  }
  .verdict { margin-top: 16px; font-size: 28px; font-weight: 800; color: var(--glow); transition: color .4s; }
  .sub { margin-top: 6px; color: var(--muted); font-size: 15px; }
  .shake { animation: shake .4s infinite; }
  @keyframes shake {
    0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px) rotate(-1deg); }
    75% { transform: translateX(4px) rotate(1deg); }
  }

  .tips { text-align: left; }
  .tips h2 { margin: 0 0 10px; font-size: 16px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .tips ul { margin: 0; padding-left: 20px; line-height: 1.6; }

  button {
    width: 100%; padding: 16px; border-radius: 16px; border: none; cursor: pointer;
    font-size: 17px; font-weight: 700; background: var(--mint); color: #000;
    box-shadow: 0 0 18px rgba(61,255,180,.4);
  }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); box-shadow: none; }
  .demo { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
  .demo input { flex: 1; accent-color: var(--mint); }
  .raw { font-size: 12px; color: var(--muted); }
  .hidden { display: none; }
  .tips-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .tips-head h2 { margin: 0; }
  .ask {
    width: auto; padding: 8px 14px; font-size: 14px; border-radius: 999px;
  }
  .ask:disabled { opacity: .5; cursor: default; }
  .by-claude { margin-top: 12px; font-size: 12px; color: var(--muted); }
  details.settings { color: var(--muted); font-size: 14px; }
  details.settings summary { cursor: pointer; }
  .key-row { display: flex; gap: 8px; margin-top: 10px; }
  .key-row input {
    flex: 1; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
    background: #000; color: var(--text); font-size: 14px;
  }
  .key-row button { width: auto; padding: 10px 16px; font-size: 14px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><div class="logo-mark">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <defs>
          <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="35%" stop-color="#c9ced3"/>
            <stop offset="60%" stop-color="#8d949b"/>
            <stop offset="100%" stop-color="#e3e6e9"/>
          </linearGradient>
        </defs>
        <!-- sock body -->
        <path d="M11 3 H20 V17 L25 21 C28 23.5 26.5 29 22 29 H13 C9.5 29 8 26.5 9.5 23.5 L11 21 Z"
              fill="url(#silver)" stroke="#f4f6f8" stroke-width="0.8"/>
        <!-- cuff stripes -->
        <rect x="11" y="5" width="9" height="1.6" rx="0.8" fill="#7a8188"/>
        <rect x="11" y="8.2" width="9" height="1.6" rx="0.8" fill="#7a8188"/>
        <!-- shine streak -->
        <path d="M13 11 V19" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
        <!-- sparkle -->
        <path d="M26 5 L27 8 L30 9 L27 10 L26 13 L25 10 L22 9 L25 8 Z" fill="#ffffff"/>
      </svg>
    </div>SniffCheck</div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Not connected</span></div>
  </header>

  <div class="card" id="meterCard">
    <div class="gauge-wrap">
      <svg viewBox="0 0 260 150">
        <defs>
          <linearGradient id="grad" x1="0" x2="1">
            <stop offset="0%" stop-color="#3dffb4"/>
            <stop offset="45%" stop-color="#ffe14d"/>
            <stop offset="75%" stop-color="#ff9a3c"/>
            <stop offset="100%" stop-color="#ff4d5e"/>
          </linearGradient>
        </defs>
        <path d="M20 140 A110 110 0 0 1 240 140" fill="none" stroke="#1f2629" stroke-width="18" stroke-linecap="round"/>
        <path id="arc" d="M20 140 A110 110 0 0 1 240 140" fill="none" stroke="url(#grad)" stroke-width="18"
              stroke-linecap="round" stroke-dasharray="346" stroke-dashoffset="346"
              style="transition: stroke-dashoffset .5s ease"/>
      </svg>
      <div class="score" id="score">0</div>
    </div>
    <div class="verdict" id="verdict">Waiting…</div>
    <div class="sub" id="sub">Connect your SniffCheck to start</div>
  </div>

  <div class="card tips">
    <div class="tips-head">
      <h2>What to do</h2>
      <button class="ask" id="askBtn">✨ Ask Claude</button>
    </div>
    <ul id="tips"><li>Plug in the sensor and press Connect.</li></ul>
    <div class="by-claude" id="byClaude"></div>
  </div>

  <button id="connectBtn">Connect sensor</button>

  <div class="demo">
    <span>Demo</span>
    <input type="range" id="demo" min="0" max="100" value="0">
  </div>
  <div class="raw" id="raw"></div>

  <details class="settings">
    <summary>Settings</summary>
    <div class="key-row">
      <input type="password" id="keyInput" placeholder="Paste your Claude API key (sk-ant-…)">
      <button id="saveKey">Save</button>
    </div>
    <div id="keyStatus" style="margin-top:8px"></div>
  </details>
</div>

<script>
const TIERS = [
  { max: 19, name: "Fresh 🌸", color: "#3dffb4", sub: "You're good to go!",
    tips: ["No action needed — enjoy your day.", "Keep rotating shoes so they stay fresh."] },
  { max: 49, name: "Hmm… 🤔", color: "#ffe14d", sub: "A little something in the air",
    tips: ["Air your shoes out tonight.", "Switch to a fresh pair of socks."] },
  { max: 79, name: "Stinky 😬", color: "#ff9a3c", sub: "Others can probably notice",
    tips: ["Change your socks now.", "Wash feet with soap and dry well, especially between toes.",
           "Let shoes dry 24h before wearing again."] },
  { max: 100, name: "BIOHAZARD ☣️", color: "#ff4d5e", sub: "Time for action!",
    tips: ["Wash socks hot (60°C) to kill odor bacteria.", "Try antibacterial insoles or foot powder.",
           "Sprinkle baking soda in shoes overnight.", "Choose cotton or wool socks over synthetics."] }
];

const $ = id => document.getElementById(id);
let lastTier = null;
let currentScore = 0;

// ---- API key: stored only in this browser on this laptop ----
function getKey() {
  try { return localStorage.getItem("sniffcheck_key") || ""; } catch (e) { return ""; }
}
function setKey(k) {
  try { localStorage.setItem("sniffcheck_key", k); return true; } catch (e) { return false; }
}
function updateKeyStatus() {
  $("keyStatus").textContent = getKey() ? "✓ Key saved on this laptop" : "No key yet — Claude tips are off";
}

// ---- Ask Claude for personal tips ----
async function askClaude() {
  const key = getKey();
  if (!key) {
    document.querySelector("details.settings").open = true;
    $("keyStatus").textContent = "Paste your Claude API key here first, then press Save.";
    return;
  }
  const tier = TIERS.find(t => currentScore <= t.max);
  $("askBtn").disabled = true;
  $("askBtn").textContent = "Thinking…";
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-haiku-5-5",
        max_tokens: 300,
        system:
          "You are SniffCheck, a friendly foot-odor coach inside a gadget for people who can't smell well " +
          "(for example anosmia or smell loss after COVID). They rely on you to know if their feet or shoes smell. " +
          "Be kind, light and a little funny, never shaming. Give exactly 3 short, practical tips (under 15 words each) " +
          "that fit the score. Reply ONLY with the 3 tips, one per line, no numbering or bullets. " +
          "If the score is 80 or more, make the last tip: if strong odor keeps coming back despite good hygiene, check with a doctor.",
        messages: [{
          role: "user",
          content: `Stink Score: ${currentScore}/100 (verdict: ${tier.name}). What should I do?`
        }]
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error ? data.error.message : "Request failed");
    const text = data.content.map(c => c.text || "").join("").trim();
    const lines = text.split("\n").map(l => l.replace(/^[-•*\d.\s]+/, "").trim()).filter(Boolean);
    $("tips").innerHTML = lines.map(l => `<li>${l.replace(/</g, "&lt;")}</li>`).join("");
    $("byClaude").textContent = "✨ Personal tips by Claude for score " + currentScore;
  } catch (err) {
    $("byClaude").textContent = "Couldn't reach Claude (" + err.message + "). Showing basic tips.";
  } finally {
    $("askBtn").disabled = false;
    $("askBtn").textContent = "✨ Ask Claude";
  }
}

$("askBtn").addEventListener("click", askClaude);
$("saveKey").addEventListener("click", () => {
  const k = $("keyInput").value.trim();
  if (!k) return;
  setKey(k);
  $("keyInput").value = "";
  updateKeyStatus();
});
updateKeyStatus();

function showScore(score, raw) {
  score = Math.max(0, Math.min(100, Math.round(score)));
  const tier = TIERS.find(t => score <= t.max);
  document.documentElement.style.setProperty("--glow", tier.color);
  $("score").textContent = score;
  $("verdict").textContent = tier.name;
  $("sub").textContent = tier.sub;
  $("arc").style.strokeDashoffset = 346 - (346 * score / 100);
  $("meterCard").classList.toggle("shake", score >= 80);
  currentScore = score;
  if (tier !== lastTier) {
    $("tips").innerHTML = tier.tips.map(t => `<li>${t}</li>`).join("");
    $("byClaude").textContent = "";
    lastTier = tier;
  }
  if (raw !== undefined) $("raw").textContent = "Sensor reading: " + raw;
}

$("demo").addEventListener("input", e => showScore(Number(e.target.value)));

async function connect() {
  if (!("serial" in navigator)) {
    alert("Please open this page in Google Chrome — Safari can't talk to the sensor.");
    return;
  }
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 9600 });
    $("dot").classList.add("on");
    $("statusText").textContent = "Connected";
    $("connectBtn").textContent = "Connected ✓";
    $("connectBtn").classList.add("secondary");
    $("sub").textContent = "Warming up… keep the sensor in fresh air";

    const reader = port.readable.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) handleLine(line.trim());
    }
  } catch (err) {
    $("statusText").textContent = "Not connected";
    $("dot").classList.remove("on");
    if (err.name !== "NotFoundError") {
      alert("Couldn't connect. Close the Serial Monitor in Arduino IDE first, then try again.");
    }
  }
}

function handleLine(line) {
  const s = line.match(/score=(\d+)/);
  const r = line.match(/raw=(\d+)/);
  if (s) { showScore(Number(s[1]), r ? r[1] : undefined); return; }
  if (line.startsWith("Warming up")) { $("verdict").textContent = "Warming up…"; $("sub").textContent = line; }
  if (line.startsWith("Learning")) { $("verdict").textContent = "Calibrating…"; $("sub").textContent = "Learning what clean air smells like"; }
}

$("connectBtn").addEventListener("click", connect);
</script>
</body>
</html>
